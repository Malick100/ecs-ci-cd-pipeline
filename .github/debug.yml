- name: Debug Variables and Secrets Check
  env:
    AWS_REGION_VAR: ${{ vars.AWS_REGION }}
    ECR_REPO_VAR: ${{ vars.ECR_REPOSITORY }}
    ROLE_SECRET: ${{ secrets.AWS_ROLE_ARN }}
  run: |
    echo "AWS Region Variable: $AWS_REGION_VAR"
    echo "ECR Repository Variable: $ECR_REPO_VAR"
    
    # Check if secret exists (GitHub automatically masks actual secret values as *** in logs)
    if [ -n "$ROLE_SECRET" ]; then
      echo "AWS_ROLE_ARN secret is set."
    else
      echo "AWS_ROLE_ARN secret is MISSING!"
    fi